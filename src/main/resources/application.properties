spring.application.name=app-back
server.port=${PORT:8081}

jwt.secret=${JWT_SECRET}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:45587}

spring.datasource.url=jdbc:postgresql://localhost:5432/schedule_db
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.jpa.hibernate.ddl-auto=validate
# Desligado por padrão: logar todo SQL custa CPU no plano gratuito. Para debugar local, JPA_SHOW_SQL=true
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false

# Ajustes para o plano gratuito do Render (512MB, CPU fracionada):
# beans criados sob demanda -> a porta abre mais rápido e o Render não dá timeout no start
spring.main.lazy-initialization=true
# menos conexões/threads ociosas -> menos memória (o tráfego atual não precisa dos defaults 10/200)
spring.datasource.hikari.maximum-pool-size=5
server.tomcat.threads.max=50

google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true