spring.application.name=app-back
server.port=${PORT:8081}

jwt.secret=${JWT_SECRET}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:45587}

spring.datasource.url=jdbc:postgresql://localhost:5432/schedule_db
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.jpa.hibernate.ddl-auto=validate
# Desligado por padrão: logar todo SQL custa CPU no plano gratuito. Para debugar local, JPA_SHOW_SQL=true
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false

# Ajustes para o plano gratuito do Render (512MB, CPU fracionada):
# beans criados sob demanda -> a porta abre mais rápido e o Render não dá timeout no start
spring.main.lazy-initialization=true
# menos conexões/threads ociosas -> menos memória (o tráfego atual não precisa dos defaults 10/200)
spring.datasource.hikari.maximum-pool-size=5
server.tomcat.threads.max=50

google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID}

# E-mail transacional via API HTTP da Brevo (o plano gratuito do Render bloqueia SMTP).
# MAIL_FROM precisa ser um remetente verificado na Brevo (ou de um dominio verificado).
brevo.base-url=https://api.brevo.com/v3
brevo.api-key=${BREVO_API_KEY:}
mail.from=${MAIL_FROM:}
mail.from-name=Softix

# Fuso dos horarios de agendamento (gravados sem fuso). O servidor no Render roda em UTC,
# entao o convite de calendario (.ics) converte a partir deste fuso, e nao do padrao da JVM.
app.time-zone=${APP_TIME_ZONE:America/Sao_Paulo}

# Timeouts das chamadas HTTP de saida (RestClient): um provedor travado nao prende a thread para sempre
spring.http.client.connect-timeout=5s
spring.http.client.read-timeout=15s